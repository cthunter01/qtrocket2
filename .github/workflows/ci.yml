# Builds and tests the CI presets on Linux, macOS and Windows, and checks formatting.
# Linux runs in an Arch Linux container so CI has the same current GCC/Clang as the dev machine.
# Qt: Linux takes Arch's packages (the newest Qt), macOS and Windows Qt 6.8.3, the oldest Qt the GUI supports, so CI
# builds the GUI against both ends: nothing newer than Qt 6.8 and nothing it deprecates.
name: CI

on:
  push:
  pull_request:
  workflow_call:   # the Release workflow runs all of CI before it tags

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang, asan, tidy]
    steps:
      - name: Install toolchain
        # llvm brings llvm-symbolizer, so sanitizer reports show functions and lines. qt6-base and qt6-svg: the GUI
        # (its tests run on the offscreen platform); ttf-dejavu: the container has no font for Qt to draw text with.
        run: pacman -Syu --noconfirm --needed cmake ninja clang llvm git qt6-base qt6-svg ttf-dejavu
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # Apple Clang from the runner's default Xcode.
  # No asan here: the Linux asan job sanitizes the same code, and Linux also has leak detection, which Apple's
  # AddressSanitizer runtime lacks. The asan preset itself still works on a Mac for local use.
  macos:
    name: macos / ${{ matrix.preset }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-clang]
    steps:
      - name: Install Ninja
        run: brew install ninja
      # Puts Qt's bin on PATH, where CMake finds Qt and the tests its libraries and plugins.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          archives: 'qtbase qtsvg'
          cache: true
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # MSVC from the runner's Visual Studio; msvc-dev-cmd sets up the Developer PowerShell environment.
  windows:
    name: windows / ci-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      # After the MSVC environment. Puts Qt's bin on PATH: CMake finds Qt there, and the tests (also
      # gtest_discover_tests' listing run) load Qt's DLLs and its plugins from there.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg'
          cache: true
      - name: Configure, build and test
        run: cmake --workflow --preset ci-msvc

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
